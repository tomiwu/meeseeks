# Base configuration for all runtime tests.
meeseeks {
  writer-id = "test-writer"
  # For production, set journal.path to an absolute path outside any code repository.
  # See runtime/src/main/resources/reference.conf for the production template.
}

pekko {
  actor {
    provider = local
    allow-java-serialization = off

    serializers {
      jackson-cbor = "org.apache.pekko.serialization.jackson.JacksonCborSerializer"
    }

    serialization-bindings {
      "meeseeks.CborSerializable" = jackson-cbor
    }
  }

  persistence {
    journal.plugin         = "jdbc-journal"
    snapshot-store.plugin  = "jdbc-snapshot-store"
  }

  loglevel = "WARNING"
  log-dead-letters = off
  log-dead-letters-during-shutdown = off
}

slick {
  profile = "slick.jdbc.H2Profile$"
  db {
    url            = "jdbc:h2:mem:persist-test;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;INIT=RUNSCRIPT FROM 'classpath:/h2-create-tables.sql'"
    driver         = "org.h2.Driver"
    numThreads     = 2
    maxConnections = 2
    minConnections = 1
  }
}

jdbc-journal {
  slick = ${slick}
  event-adapters {
    counter-adapter = "meeseeks.CounterEventAdapter"
  }
  event-adapter-bindings {
    # Bind old format for migration reads.
    "meeseeks.IncrementedV1"       = counter-adapter
    # Bind current format for all writes and reads.
    "meeseeks.Counter$Incremented" = counter-adapter
  }
}

jdbc-snapshot-store { slick = ${slick} }
