# Meeseeks production configuration template.
#
# meeseeks.writer-id  - unique string per server instance; stamped on every journal event.
# meeseeks.journal.path - absolute path outside any code repository for the H2 journal file.
#
# Production slick URL example (file-based H2, path outside repo):
#   slick.db.url = "jdbc:h2:file:"${meeseeks.journal.path}"/meeseeks;DATABASE_TO_UPPER=false"
#   meeseeks.journal.path = "/var/lib/meeseeks/journal"
#
# Java serialization is always off. All events use Jackson CBOR.
# The test configuration (runtime/src/test/resources/application.conf) uses in-memory H2.

meeseeks {
  writer-id = "default"
  journal.path = "/tmp/meeseeks-journal"
}
