# Meeseeks production configuration.
#
# Override env vars:
#   MEESEEKS_TELEGRAM_BOT_TOKEN  - Telegram bot token (required, not stored here)
#   MEESEEKS_OWNER_ID            - Telegram numeric chat ID of the owner (required)
#   MEESEEKS_JOURNAL_PATH        - absolute path for the H2 journal files (default: ./data/journal)
#   MEESEEKS_WRITER_ID           - unique writer ID stamped on every event (default: prod-1)
#   MEESEEKS_BRAIN               - set to "fake" for smoke testing only
#
# Java serialization is off. All events use Jackson CBOR.
# The test configuration (runtime/src/test/resources/application.conf) uses in-memory H2
# and shadows this file during test runs.

meeseeks {
  writer-id = "prod-1"
  journal.path = "./data/journal"
}

pekko {
  actor {
    provider = local
    allow-java-serialization = off

    serializers {
      jackson-cbor = "org.apache.pekko.serialization.jackson.JacksonCborSerializer"
    }

    serialization-bindings {
      "meeseeks.CborSerializable" = jackson-cbor
    }
  }

  persistence {
    journal.plugin        = "jdbc-journal"
    snapshot-store.plugin = "jdbc-snapshot-store"
  }

  loglevel = "INFO"
  log-dead-letters = 10
  log-dead-letters-during-shutdown = off
}

slick {
  profile = "slick.jdbc.H2Profile$"
  db {
    # File-based H2: path comes from meeseeks.journal.path set by Main at startup.
    url            = "jdbc:h2:file:"${meeseeks.journal.path}"/meeseeks;DATABASE_TO_UPPER=false;INIT=RUNSCRIPT FROM 'classpath:/h2-create-tables.sql'"
    driver         = "org.h2.Driver"
    numThreads     = 2
    maxConnections = 2
    minConnections = 1
  }
}

jdbc-journal {
  slick = ${slick}
  event-adapters {
    counter-adapter = "meeseeks.CounterEventAdapter"
  }
  event-adapter-bindings {
    "meeseeks.IncrementedV1"       = counter-adapter
    "meeseeks.Counter$Incremented" = counter-adapter
  }
}

jdbc-snapshot-store { slick = ${slick} }
