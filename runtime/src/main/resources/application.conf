# Meeseeks production configuration.
#
# Required env vars:
#   MEESEEKS_TELEGRAM_BOT_TOKEN  - Telegram bot token
#   MEESEEKS_OWNER_ID            - Telegram numeric chat ID of the owner
#
# Optional env vars:
#   MEESEEKS_JOURNAL_PATH        - absolute path for H2 journal files (default: ./data/journal)
#   MEESEEKS_WRITER_ID           - unique writer ID stamped on every event (default: prod-1)
#
# Brain selection (MEESEEKS_BRAIN, default: subscription):
#   fake         - smoke-test only; no real AI calls
#   subscription - Claude Code inside Podman (production default)
#   apikey       - Anthropic Messages API; requires MEESEEKS_BRAIN_API_KEY
#   local        - OpenAI-compatible local endpoint (e.g. Ollama)
#
# Subscription backend:
#   MEESEEKS_SANDBOX_IMAGE                - Podman image with Claude Code (default: meeseeks/brain:latest)
#   MEESEEKS_BRAIN_SUBSCRIPTION_CREDENTIAL - value injected as ANTHROPIC_API_KEY inside the container (optional)
#
# ApiKey backend:
#   MEESEEKS_BRAIN_API_KEY   - Anthropic API key; secret; never logged
#   MEESEEKS_BRAIN_API_MODEL - model ID (default: claude-opus-4-5)
#
# LocalModel backend:
#   MEESEEKS_LOCAL_MODEL_HOST  - base URL of OpenAI-compatible server (default: http://localhost:11434)
#   MEESEEKS_LOCAL_MODEL_NAME  - model name (default: llama3.2)
#
# Java serialization is off. All events use Jackson CBOR.
# The test configuration (runtime/src/test/resources/application.conf) uses in-memory H2
# and shadows this file during test runs.

meeseeks {
  writer-id = "prod-1"
  journal.path = "./data/journal"
}

pekko {
  actor {
    provider = local
    allow-java-serialization = off

    serializers {
      jackson-cbor = "org.apache.pekko.serialization.jackson.JacksonCborSerializer"
    }

    serialization-bindings {
      "meeseeks.CborSerializable" = jackson-cbor
    }
  }

  persistence {
    journal.plugin        = "jdbc-journal"
    snapshot-store.plugin = "jdbc-snapshot-store"
  }

  loglevel = "INFO"
  log-dead-letters = 10
  log-dead-letters-during-shutdown = off
}

slick {
  profile = "slick.jdbc.H2Profile$"
  db {
    # File-based H2: path comes from meeseeks.journal.path set by Main at startup.
    url            = "jdbc:h2:file:"${meeseeks.journal.path}"/meeseeks;DATABASE_TO_UPPER=false;INIT=RUNSCRIPT FROM 'classpath:/h2-create-tables.sql'"
    driver         = "org.h2.Driver"
    numThreads     = 2
    maxConnections = 2
    minConnections = 1
  }
}

jdbc-journal {
  slick = ${slick}
  event-adapters {
    counter-adapter = "meeseeks.CounterEventAdapter"
  }
  event-adapter-bindings {
    "meeseeks.IncrementedV1"       = counter-adapter
    "meeseeks.Counter$Incremented" = counter-adapter
  }
}

jdbc-snapshot-store { slick = ${slick} }
